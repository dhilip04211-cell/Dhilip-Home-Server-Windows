name: Build DhilipHome Server Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --clean --noconfirm windows/DhilipHomeServer.spec

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/DhilipHomeServer.exe release/
          Copy-Item .env.example release/
          Copy-Item windows/start_server.bat release/
          Compress-Archive -Path release/* -DestinationPath DhilipHomeServer-Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DhilipHomeServer-Windows
          path: DhilipHomeServer-Windows.zip
