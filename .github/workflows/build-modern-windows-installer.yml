name: Build Dhilip Home Modern Windows Installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: cmd
        working-directory: dhilip-home-server-main
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r windows-desktop\requirements-windows.txt
          python -m pip install pyinstaller
      - name: Build one-app EXE
        shell: cmd
        working-directory: dhilip-home-server-main
        run: |
          pyinstaller --clean --noconfirm windows-desktop\DhilipHome.spec
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: cmd
        working-directory: dhilip-home-server-main
        run: |
          if not exist release mkdir release
          iscc installer\DhilipHome.iss
      - uses: actions/upload-artifact@v4
        with:
          name: DhilipHome-Modern-Installer
          path: dhilip-home-server-main/release/DhilipHome-Setup-*.exe
