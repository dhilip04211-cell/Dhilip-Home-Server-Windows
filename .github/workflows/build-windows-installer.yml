name: Build Dhilip Home Server Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: cmd
        working-directory: dhilip-home-server-main
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build standalone EXE
        shell: cmd
        working-directory: dhilip-home-server-main
        run: |
          call windows\build_windows.bat

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: cmd
        run: |
          if not exist release mkdir release
          iscc dhilip-home-server-main\installer\DhilipHomeServer.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DhilipHomeServer-Windows-Installer
          path: release\DhilipHomeServer-Setup-*.exe

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: DhilipHomeServer-Standalone-EXE
          path: dhilip-home-server-main\dist\DhilipHomeServer.exe